<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Lifeplan</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #10261c; background: #f7f6f0; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 1rem 0 1.25rem; }
      button { min-height: 48px; padding: 0 1.75rem; border: 0; border-radius: 999px; background: #22c55e; color: #10261c; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #166534; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) { body { color: #eef0e8; background: #0d1410; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You are offline</h1>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
